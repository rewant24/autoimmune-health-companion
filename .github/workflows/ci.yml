name: CI

# PR gate (Lane 1A S-slice): frozen install + typecheck + unit tests + build.
# Integration (tests/integration), live-LLM (*.live.test.ts), and Playwright
# e2e are deliberately NOT in this gate — they need real deployments/keys.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Public client value (dev deployment) from the repo Actions variable.
      # next build prerenders ConvexClientProvider, which throws without it.
      NEXT_PUBLIC_CONVEX_URL: ${{ vars.NEXT_PUBLIC_CONVEX_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4 # version comes from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:run
      - run: pnpm build
